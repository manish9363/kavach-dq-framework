name: Python unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install 'pytest>=8,<10' 'ruff==0.16.10'
      - name: Lint core package and tests
        run: ruff check --config pyproject.toml kavach tests
      - name: Run unit tests
        run: python -m pytest tests/unit -q
