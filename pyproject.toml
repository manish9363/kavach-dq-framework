[project]
name = "kavach-dq-framework"
version = "0.1.0"
description = "Agentic Data Quality Framework powered by AWS Bedrock"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "boto3>=1.34.0",
    "aws-cdk-lib>=2.150.0",
    "constructs>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
